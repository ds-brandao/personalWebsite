name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Never run two deploys at once; cancel superseded PR builds
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        run: COMMIT_SHA="${COMMIT_SHA_FULL:0:7}" npx opennextjs-cloudflare build
        env:
          COMMIT_SHA_FULL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # PRs: upload a preview version (own shareable URL, production untouched)
      - name: Upload preview version (PR)
        if: github.event_name == 'pull_request'
        run: |
          npx opennextjs-cloudflare upload -- --message "PR #${{ github.event.pull_request.number }}" | tee upload.log
          {
            echo "## Cloudflare preview"
            grep -Eo 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev[^ ]*' upload.log | head -1 \
              || echo "Preview uploaded — URL in the step log above."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # main: copy runtime secrets from repo secrets onto the Worker, so GitHub
      # stays the one place to change them. Runs before the deploy so the new
      # version starts with them; Worker secrets persist across deploys. Not on
      # PRs: `secret bulk` deploys to production immediately.
      - name: Sync Worker secrets (main)
        if: github.event_name == 'push'
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY repo secret not set; link click alerts stay off"
            exit 0
          fi
          jq -n \
            --arg RESEND_API_KEY "$RESEND_API_KEY" \
            --arg LINK_ALERT_TO "$LINK_ALERT_TO" \
            --arg LINK_ALERT_FROM "$LINK_ALERT_FROM" \
            '$ARGS.named' | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LINK_ALERT_TO: ${{ secrets.LINK_ALERT_TO }}
          LINK_ALERT_FROM: ${{ secrets.LINK_ALERT_FROM }}

      # main: deploy to production
      - name: Deploy to production (main)
        if: github.event_name == 'push'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        if: github.event_name == 'push'
        env:
          SITE_URL: https://dbrandao.com
        run: |
          # The zone challenges non-browser clients (cf-mitigated: challenge).
          # A challenged response still proves DNS + edge are serving the host,
          # so treat it as reachable; only hard-fail on other errors.
          for path in / /articles /projects; do
            headers=$(curl -s -D- -o /dev/null --retry 10 --retry-delay 10 --retry-all-errors "${SITE_URL}${path}")
            code=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP/ { c=$2 } END { print c }')
            if [ "$code" = "200" ]; then
              echo "OK   ${path} (HTTP ${code})"
            elif printf '%s' "$headers" | grep -qi "^cf-mitigated: challenge"; then
              echo "OK   ${path} (challenged by bot protection — edge serving)"
            else
              echo "FAIL ${path} (HTTP ${code})"
              exit 1
            fi
          done

          # www must resolve (custom domain) and 301 to the apex.
          # Exact Location: Next does not interpolate `:path*` for `/`, so a
          # prefix match would accept the broken URL https://dbrandao.com/:path*.
          check_www() {
            local path="$1" expected="$2"
            local headers code location
            headers=$(curl -s -D- -o /dev/null --retry 10 --retry-delay 10 --retry-all-errors "https://www.dbrandao.com${path}")
            code=$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP/ { c=$2 } END { print c }')
            location=$(printf '%s' "$headers" | awk 'tolower($1) == "location:" { print $2; exit }' | tr -d '\r')
            if printf '%s' "$location" | grep -q ':path'; then
              echo "FAIL www${path} (uninterpolated placeholder in Location: ${location})"
              exit 1
            elif [ "$code" = "301" ] && [ "$location" = "$expected" ]; then
              echo "OK   www${path} → ${expected} (HTTP ${code})"
            elif printf '%s' "$headers" | grep -qi "^cf-mitigated: challenge"; then
              echo "OK   www${path} (challenged by bot protection — DNS + edge serving)"
            else
              echo "FAIL www${path} (HTTP ${code} Location: ${location})"
              exit 1
            fi
          }
          check_www "/" "https://dbrandao.com/"
          check_www "/articles" "https://dbrandao.com/articles"
